name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests, build, budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Skip install scripts: onnxruntime-node (a Node-only transitive dependency of
      # transformers.js) downloads a native binary the browser build never uses.
      - run: npm ci --ignore-scripts
      - run: npm run verify

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            specs: tests/e2e/screen.spec.ts tests/e2e/screen-ocr.spec.ts tests/e2e/cross-browser.spec.ts tests/e2e/smoke.spec.ts
          # Headless Firefox on Linux can't fake a shared screen, so Firefox runs headed in a
          # virtual display (xvfb) to cover screen recording too.
          - browser: firefox
            run: xvfb-run --auto-servernum
            flags: --headed
            specs: tests/e2e/screen.spec.ts tests/e2e/screen-ocr.spec.ts tests/e2e/cross-browser.spec.ts tests/e2e/smoke.spec.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/make-fixture.mjs
      # The fast specs: screen recording, drawing, replay, exports (zip and video), on-device
      # OCR, the home page and smoke checks. Specs that download the speech model (80+ MB per
      # test) run locally: npm run test:e2e.
      - run: ${{ matrix.run }} npx playwright test --project=${{ matrix.browser }} ${{ matrix.flags }} ${{ matrix.specs }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results
          retention-days: 7

  e2e-full:
    name: E2E full suite (chromium, speech model)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # Model and runtime downloads, served to tests from disk (tests/e2e/fixtures.ts).
      - uses: actions/cache@v4
        with:
          path: .cache/e2e-net
          key: e2e-net-${{ hashFiles('src/features/transcribe/config.ts', 'src/features/search/config.ts', 'package-lock.json') }}
          restore-keys: e2e-net-
      # Spoken audio for the fake microphone (macOS uses `say`; here, espeak-ng).
      - run: sudo apt-get install -y --no-install-recommends espeak-ng
      - run: node scripts/make-fixture.mjs
      # Everything except the README screenshot generator.
      - run: npx playwright test --project=chromium --grep-invert "README screenshots"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full
          path: test-results
          retention-days: 7
