name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests, build, budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Skip install scripts: onnxruntime-node (a Node-only transitive dependency of
      # transformers.js) downloads a native binary the browser build never uses.
      - run: npm ci --ignore-scripts
      - run: npm run verify

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: node scripts/make-fixture.mjs
      # The fast specs: screen recording, drawing, replay, exports (zip and video), on-device
      # OCR, the home page and smoke checks. Specs that download the speech model (80+ MB per
      # test) run locally: npm run test:e2e.
      - run: >-
          npx playwright test --project=${{ matrix.browser }}
          tests/e2e/screen.spec.ts tests/e2e/screen-ocr.spec.ts
          tests/e2e/cross-browser.spec.ts tests/e2e/smoke.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results
          retention-days: 7
